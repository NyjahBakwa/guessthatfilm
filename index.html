<!DOCTYPE html>
<html lang="nl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Guess That Film</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="wrapper">
      <h1>Guess That Film</h1>
      <div class="num-of-tries-left" id="chanceCount">
        <span>Resterende pogingen:</span> 5
      </div>
      <div class="container"></div>
      <div id="letter-container" class="hide"></div>
      <div id="userInputSection"></div>
    </div>
    <div class="controls-container">
      <p id="result">Raad de film aan de hand van de emoji's.</p>
      <button id="start">Start</button>
    </div>

    <script src="script.js"></script>
  </body>
</html>
